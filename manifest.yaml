version: 0.0.1
type: plugin
author: hanshs474
name: veida
label:
  en_US: Veida
  zh_Hans: Veida
description:
  en_US: >-
    Generate an image from a prompt with no API key and no account. Runs on
    Veida's anonymous endpoint (https://veida.ai), so the plugin works the moment
    it is installed — nothing to configure, nothing to buy first. Anonymous
    output is 1K and watermarked, and the tool says so rather than letting a
    workflow discover it.
  zh_Hans: >-
    不需要 API key、也不需要账号,直接从提示词生成图片。走 Veida(https://veida.ai)
    的匿名端点,装上即可用 —— 没有任何要配置的凭据,也不用先买额度。
    匿名输出为 1K 且带水印,工具会直接说明,而不是让工作流自己撞上。
icon: icon.svg
resource:
  memory: 33554432
  permission:
    tool:
      enabled: true
plugins:
  tools:
    - provider/veida.yaml
meta:
  version: 0.0.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
  minimum_dify_version: null
privacy: PRIVACY.md
created_at: 2026-09-06T17:00:00.000000+08:00
